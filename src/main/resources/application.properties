spring.application.name=annotation-nlp-platform

# Default: self-contained embedded H2 database (no external service needed) so the
# packaged jar runs with a simple `java -jar app.jar`. Data is initialized at startup.
# To use MariaDB instead, override DB_URL/DB_USER/DB_PASSWORD/DB_DRIVER (see docker-compose.yml).
spring.datasource.url=${DB_URL:jdbc:h2:mem:annotationdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

app.python.executable=${PYTHON_EXECUTABLE:python}
