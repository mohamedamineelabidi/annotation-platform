spring.application.name=annotation-nlp-platform

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3310/annotation_nlp}
spring.datasource.username=${DB_USER:annotation}
spring.datasource.password=${DB_PASSWORD:annotation}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

app.python.executable=${PYTHON_EXECUTABLE:python}
