<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travailler - AnnotateAI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <a class="brand" th:href="@{/annotator/dashboard}">
            <span class="brand-mark"><i class="bi bi-asterisk"></i></span>
            <span class="brand-word">
                <span class="brand-word-top">ANNOTATE</span>
                <span class="brand-word-bottom">AI Studio</span>
            </span>
        </a>
        <nav class="side-nav">
            <a class="side-link" th:href="@{/annotator/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="side-link" th:href="@{/annotator/annotate}"><i class="bi bi-pencil-square"></i> Annotate</a>
            <a class="side-link active" th:href="@{/annotator/tasks}"><i class="bi bi-list-check"></i> Tâches</a>
            <a class="side-link" th:href="@{/annotator/stats}"><i class="bi bi-bar-chart"></i> Statistics</a>
        </nav>
        <div class="side-foot">
            <div class="side-user">
                <span class="avatar">AN</span>
                <div><div class="side-user-name">Annotator</div><div class="side-user-role">Contributor</div></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-soft w-100" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </aside>
    <div class="app-body">
        <header class="topbar">
            <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
            <div class="search"><i class="bi bi-search"></i><input type="text" placeholder="Rechercher..."></div>
            <div class="topbar-actions"><span class="pill online"><span class="dot"></span> Online</span></div>
        </header>
        <main class="app-content">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                <div>
                    <h1 class="page-title" th:text="${task.dataset.name}">Dataset</h1>
                    <p class="page-sub">Annotez chaque couple puis validez.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/annotator/tasks}"><i class="bi bi-arrow-left"></i> Mes tâches</a>
            </div>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="empty-note" th:if="${empty}">
                <span class="en-ico"><i class="bi bi-inbox"></i></span>
                Aucun couple dans cette tâche.
            </div>

            <div class="ui-card" th:unless="${empty}" style="max-width:820px">
                <div class="card-head">
                    <div>
                        <span class="tag muted" th:text="${item.taskType.displayName}">Task</span>
                        <h2 class="card-title mt-2">Couple <span th:text="${item.externalId}">id</span></h2>
                    </div>
                    <span class="tag" th:classappend="${taskItem.completed} ? ' success' : ' muted'"
                          th:text="${taskItem.completed} ? 'Annoté' : 'En attente'">En attente</span>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted">Text1</label>
                    <div class="p-3 rounded" style="background:var(--brand-card);border:1px solid var(--brand-border)" th:text="${item.text1}">text1</div>
                </div>
                <div class="mb-3" th:if="${item.text2 != null}">
                    <label class="form-label text-muted">Text2</label>
                    <div class="p-3 rounded" style="background:var(--brand-card);border:1px solid var(--brand-border)" th:text="${item.text2}">text2</div>
                </div>

                <form th:action="@{'/annotator/tasks/' + ${task.id} + '/work'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="taskItemId" th:value="${taskItem.id}">
                    <input type="hidden" name="index" th:value="${index}">
                    <label class="form-label">Classe</label>
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <label class="chip-radio" th:each="label : ${labels}">
                            <input class="form-check-input me-1" type="radio" name="label"
                                   th:value="${label.name}" th:checked="${existingLabel == label.name}" required>
                            <span th:text="${label.name}">classe</span>
                        </label>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a class="btn btn-outline-secondary"
                           th:classappend="${previousIndex == null} ? 'disabled'"
                           th:href="@{'/annotator/tasks/' + ${task.id} + '/work'(index=${previousIndex != null ? previousIndex : 0})}">&laquo; Précédent</a>
                        <span class="text-muted small" th:text="'Couple ' + (${index} + 1) + ' / ' + ${total}">Couple</span>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Valider</button>
                            <a class="btn btn-outline-secondary"
                               th:classappend="${nextIndex == null} ? 'disabled'"
                               th:href="@{'/annotator/tasks/' + ${task.id} + '/work'(index=${nextIndex != null ? nextIndex : index})}">Suivant &raquo;</a>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
