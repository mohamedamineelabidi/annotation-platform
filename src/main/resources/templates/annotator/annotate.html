<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annotate - AnnotateAI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-logo"><i class="bi bi-bounding-box-circles"></i></span>
            <span class="brand-name">AnnotateAI</span>
        </div>
        <nav class="side-nav">
            <a class="side-link" th:href="@{/annotator/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="side-link active" th:href="@{/annotator/annotate}"><i class="bi bi-pencil-square"></i> Annotate</a>
            <a class="side-link" th:href="@{/annotator/stats}"><i class="bi bi-bar-chart"></i> Statistics</a>
        </nav>
        <div class="side-foot">
            <div class="side-user">
                <span class="avatar">AN</span>
                <div><div class="side-user-name">Annotator</div><div class="side-user-role">Contributor</div></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-soft w-100" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </aside>
    <div class="app-body">
        <header class="topbar">
            <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
            <div class="search"><i class="bi bi-search"></i><input type="text" placeholder="Search..."></div>
            <div class="topbar-actions"><span class="pill online"><span class="dot"></span> Online</span></div>
        </header>
        <main class="app-content">
            <h1 class="page-title">Annotate</h1>
            <p class="page-sub">Read the text carefully and assign the most appropriate class.</p>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="ui-card" th:if="${assignment != null}" style="max-width:820px;">
                <div class="card-head">
                    <div>
                        <span class="tag muted" th:text="${assignment.datasetItem.taskType.displayName}">Task</span>
                        <h2 class="card-title mt-2">Text <span th:text="${assignment.datasetItem.externalId}">id</span></h2>
                    </div>
                    <span class="tag" th:classappend="${assignment.completed} ? ' success' : ' muted'" th:text="${assignment.completed} ? 'Completed' : 'Pending'">Pending</span>
                </div>
                <div class="text-card p-3 mb-3" th:text="${assignment.datasetItem.text1}">Text 1</div>
                <div class="text-card p-3 mb-3" th:if="${assignment.datasetItem.text2 != null}" th:text="${assignment.datasetItem.text2}">Text 2</div>
                <form th:action="@{/annotator/annotate}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="itemId" th:value="${assignment.datasetItem.id}">
                    <input type="hidden" name="startedAtMillis" th:value="${startedAtMillis}">
                    <div class="mb-4">
                        <label class="form-label">Choose class</label>
                        <div class="row g-2">
                            <div class="col-md-4" th:each="label : ${labels}">
                                <input class="btn-check" type="radio" name="labelId" th:id="'label-' + ${label.id}" th:value="${label.id}" th:checked="${existingAnnotation != null and existingAnnotation.label.id == label.id}" required>
                                <label class="btn btn-outline-primary w-100" th:for="'label-' + ${label.id}" th:text="${label.name}">Label</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex gap-2">
                            <a class="btn btn-soft" th:if="${previousItemId != null}" th:href="@{/annotator/annotate(itemId=${previousItemId})}"><i class="bi bi-arrow-left"></i> Previous</a>
                            <a class="btn btn-soft" th:if="${nextItemId != null}" th:href="@{/annotator/annotate(itemId=${nextItemId})}">Next <i class="bi bi-arrow-right"></i></a>
                        </div>
                        <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Save annotation</button>
                    </div>
                </form>
            </div>
            <div class="ui-card" th:if="${assignment == null}" style="max-width:820px;">
                <div class="row-item" style="margin:0;border:none;">
                    <span class="row-ico" style="background:var(--sky-soft);color:var(--sky);"><i class="bi bi-inbox"></i></span>
                    <div class="row-main">
                        <div class="row-name">No assignment available</div>
                        <div class="row-meta">Ask the administrator to import data and assign texts.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
