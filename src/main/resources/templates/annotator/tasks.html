<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tâches - LabelCraft</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <a class="brand" th:href="@{/annotator/dashboard}">
            <span class="brand-mark"><i class="bi bi-asterisk"></i></span>
            <span class="brand-word">
                <span class="brand-word-top">LabelCraft</span>
            </span>
        </a>
        <nav class="side-nav">
            <a class="side-link" th:href="@{/annotator/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="side-link" th:href="@{/annotator/annotate}"><i class="bi bi-pencil-square"></i> Annotate</a>
            <a class="side-link active" th:href="@{/annotator/tasks}"><i class="bi bi-list-check"></i> Tâches</a>
            <a class="side-link" th:href="@{/annotator/stats}"><i class="bi bi-bar-chart"></i> Statistics</a>
        </nav>
        <div class="side-foot">
            <div class="side-user">
                <span class="avatar">AN</span>
                <div><div class="side-user-name">Annotator</div><div class="side-user-role">Contributor</div></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-soft w-100" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </aside>
    <div class="app-body">
        <header class="topbar">
            <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
            <div class="search"><i class="bi bi-search"></i><input type="text" placeholder="Rechercher..."></div>
            <div class="topbar-actions"><span class="pill online"><span class="dot"></span> Online</span></div>
        </header>
        <main class="app-content">
            <h1 class="page-title">Liste des tâches</h1>
            <p class="page-sub">Vos datasets à annoter et leur avancement.</p>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="ui-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr><th>Id</th><th>Nom du dataset</th><th>Date limite</th><th>% Avancement</th><th>Taille</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(tasks)}">
                            <td colspan="6">
                                <div class="empty-note">
                                    <span class="en-ico"><i class="bi bi-inbox"></i></span>
                                    Aucune tâche affectée pour le moment.
                                </div>
                            </td>
                        </tr>
                        <tr th:each="t : ${tasks}">
                            <td style="font-weight:600" th:text="${t.id}">1</td>
                            <td th:text="${t.datasetName}">Dataset</td>
                            <td th:text="${t.deadline != null ? #temporals.format(t.deadline, 'dd/MM/yyyy') : '—'}">—</td>
                            <td style="min-width:180px">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="progress flex-grow-1" style="height:8px">
                                        <div class="progress-bar" role="progressbar" th:style="'width:' + ${t.progress} + '%'"></div>
                                    </div>
                                    <span class="text-muted small" th:text="${#numbers.formatDecimal(t.progress,1,1)} + '%'">0%</span>
                                </div>
                            </td>
                            <td th:text="${t.size}">0</td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-primary" th:href="@{'/annotator/tasks/' + ${t.id} + '/work'}"><i class="bi bi-pencil-square"></i> Travailler</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
