<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - AnnotateAI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark"><i class="bi bi-asterisk"></i></span>
            <span class="brand-word">
                <span class="brand-word-top">ANNOTATE</span>
                <span class="brand-word-bottom">AI Studio</span>
            </span>
        </div>
        <h1 class="h4 mb-1" style="font-weight:800;">Welcome back</h1>
        <p class="small-muted mb-4">Sign in to your annotation workspace</p>
        <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
        <div class="small-muted mt-4" style="text-align:center;">
            Demo: admin/admin &middot; user1/user1 &middot; user2/user2 &middot; user3/user3
        </div>
    </div>
</main>
</body>
</html>
