<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Affecter des annotateurs - AnnotateAI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <a class="brand" th:href="@{/admin/dashboard}">
            <span class="brand-mark"><i class="bi bi-asterisk"></i></span>
            <span class="brand-word">
                <span class="brand-word-top">ANNOTATE</span>
                <span class="brand-word-bottom">AI Studio</span>
            </span>
        </a>
        <nav class="side-nav">
            <a class="side-link" th:href="@{/admin/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="side-link active" th:href="@{/admin/datasets}"><i class="bi bi-collection"></i> Datasets</a>
            <a class="side-link" th:href="@{/admin/users}"><i class="bi bi-people"></i> Users</a>
            <a class="side-link" th:href="@{/admin/import}"><i class="bi bi-cloud-arrow-up"></i> Import</a>
            <a class="side-link" th:href="@{/admin/labels}"><i class="bi bi-tags"></i> Labels</a>
            <a class="side-link" th:href="@{/admin/assignments}"><i class="bi bi-clipboard-check"></i> Assignments</a>
            <a class="side-link" th:href="@{/admin/stats}"><i class="bi bi-bar-chart"></i> Statistics</a>
            <a class="side-link" th:href="@{/admin/training}"><i class="bi bi-cpu"></i> Training</a>
            <a class="side-link" th:href="@{/admin/export/csv}"><i class="bi bi-download"></i> Export CSV</a>
        </nav>
        <div class="side-foot">
            <div class="side-user">
                <span class="avatar">AD</span>
                <div><div class="side-user-name">Administrator</div><div class="side-user-role">Admin</div></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-soft w-100" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </aside>
    <div class="app-body">
        <header class="topbar">
            <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
            <div class="topbar-label"><span class="tl-k">Studio</span><span class="tl-v">Admin workspace</span></div>
            <div class="search"><i class="bi bi-search"></i><input type="text" placeholder="Rechercher..."></div>
            <div class="topbar-actions"><span class="pill online"><span class="dot"></span> Online</span></div>
        </header>
        <main class="app-content">
            <h1 class="page-title">Affecter des annotateurs</h1>
            <p class="page-sub">Dataset : <strong th:text="${dataset.name}">Nom</strong></p>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="ui-card" style="max-width:680px">
                <form th:action="@{'/admin/datasets/' + ${dataset.id} + '/assign'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label" for="deadline">Date limite</label>
                        <input class="form-control" type="date" id="deadline" name="deadline">
                    </div>
                    <label class="form-label">Annotateurs</label>
                    <div th:if="${#lists.isEmpty(annotators)}" class="empty-note">
                        <span class="en-ico"><i class="bi bi-person-x"></i></span>
                        Aucun annotateur actif. Créez-en dans la section Users.
                    </div>
                    <div class="list-group mb-3" th:unless="${#lists.isEmpty(annotators)}">
                        <label class="list-group-item d-flex align-items-center gap-2" th:each="u : ${annotators}">
                            <input class="form-check-input m-0" type="checkbox" name="annotatorIds"
                                   th:value="${u.id}" th:checked="${assignedIds.contains(u.id)}">
                            <span>
                                <strong th:text="${u.username}">login</strong>
                                <span class="text-muted small"
                                      th:text="${(u.firstName != null ? u.firstName : '') + ' ' + (u.lastName != null ? u.lastName : '')}"></span>
                            </span>
                        </label>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a class="btn btn-outline-secondary" th:href="@{'/admin/datasets/' + ${dataset.id}}">Annuler</a>
                        <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Valider</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
