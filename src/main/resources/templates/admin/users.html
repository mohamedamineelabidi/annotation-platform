<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - AnnotateAI</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-logo"><i class="bi bi-bounding-box-circles"></i></span>
            <span class="brand-name">AnnotateAI</span>
        </div>
        <nav class="side-nav">
            <a class="side-link" th:href="@{/admin/dashboard}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a class="side-link active" th:href="@{/admin/users}"><i class="bi bi-people"></i> Users</a>
            <a class="side-link" th:href="@{/admin/import}"><i class="bi bi-cloud-arrow-up"></i> Import</a>
            <a class="side-link" th:href="@{/admin/labels}"><i class="bi bi-tags"></i> Labels</a>
            <a class="side-link" th:href="@{/admin/assignments}"><i class="bi bi-clipboard-check"></i> Assignments</a>
            <a class="side-link" th:href="@{/admin/stats}"><i class="bi bi-bar-chart"></i> Statistics</a>
            <a class="side-link" th:href="@{/admin/training}"><i class="bi bi-cpu"></i> Training</a>
            <a class="side-link" th:href="@{/admin/export/csv}"><i class="bi bi-download"></i> Export CSV</a>
        </nav>
        <div class="side-foot">
            <div class="side-user">
                <span class="avatar">AD</span>
                <div><div class="side-user-name">Administrator</div><div class="side-user-role">Admin</div></div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-soft w-100" type="submit"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </aside>
    <div class="app-body">
        <header class="topbar">
            <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
            <div class="search"><i class="bi bi-search"></i><input type="text" placeholder="Search annotators..."></div>
            <div class="topbar-actions"><span class="pill online"><span class="dot"></span> Online</span></div>
        </header>
        <main class="app-content">
            <h1 class="page-title">Users</h1>
            <p class="page-sub">Manage annotator accounts and access.</p>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="grid-2-1">
                <div class="ui-card">
                    <div class="card-head"><div><h2 class="card-title">Annotator accounts</h2><p class="card-subtitle">Edit credentials and status</p></div></div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead><tr><th>Username</th><th>Password</th><th>Enabled</th><th></th></tr></thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <form th:action="@{'/admin/users/' + ${user.id}}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <td><input class="form-control form-control-sm" name="username" th:value="${user.username}" required></td>
                                    <td><input class="form-control form-control-sm" type="password" name="password" placeholder="Leave blank"></td>
                                    <td class="text-center"><input class="form-check-input" type="checkbox" name="enabled" th:checked="${user.enabled}"></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary" type="submit">Save</button>
                                </form>
                                        <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="ui-card">
                    <div class="card-head"><div><h2 class="card-title">Create annotator</h2><p class="card-subtitle">Add a new account</p></div><span class="stat-ico i-brand"><i class="bi bi-person-plus"></i></span></div>
                    <form th:action="@{/admin/users}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" required>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="enabled" id="enabledNew" checked>
                            <label class="form-check-label" for="enabledNew">Enabled</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-plus-lg"></i> Create account</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
